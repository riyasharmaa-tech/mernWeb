<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-header">
            <h1>Student Registration Form</h1>
            <p class="form-subtitle">Please fill out all required fields carefully before submission.</p>
        </div>

        <form>
            <fieldset>
                <legend>Personal Information</legend>
                
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" maxlength="50" required autofocus>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fathername">Father's Name:</label>
                        <input type="text" id="fathername" name="fathername" placeholder="Enter your father's name" required>
                    </div>

                    <div class="form-group">
                        <label for="mothername">Mother's Name:</label>
                        <input type="text" id="mothername" name="mothername" placeholder="Enter your mother's name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="student@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number:</label>
                        <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" max="2015-01-01" required>
                </div>

                <div class="form-group">
                    <label for="address">Residential Address:</label>
                    <textarea id="address" name="address" rows="3" placeholder="Enter your full address" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" placeholder="Enter city" required>
                    </div>

                    <div class="form-group">
                        <label for="state">State:</label>
                        <select id="state" name="state" required>
                            <option value="">Select State</option>
                            <optgroup label="North India">
                                <option value="delhi">Delhi</option>
                                <option value="punjab">Punjab</option>
                                <option value="up">Uttar Pradesh</option>
                            </optgroup>
                            <optgroup label="West India">
                                <option value="mp">Madhya Pradesh</option>
                                <option value="maharashtra">Maharashtra</option>
                                <option value="gujarat">Gujarat</option>
                            </optgroup>
                            <optgroup label="South India">
                                <option value="karnataka">Karnataka</option>
                                <option value="tamilnadu">Tamil Nadu</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Academic Details</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="qualification">Previous Qualification:</label>
                        <select id="qualification" name="qualification" required>
                            <option value="">Select Qualification</option>
                            <optgroup label="School">
                                <option value="10th">10th</option>
                                <option value="12th">12th</option>
                            </optgroup>
                            <optgroup label="Higher Education">
                                <option value="graduate">Graduate</option>
                                <option value="postgraduate">Post Graduate</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="course">Course Selection:</label>
                        <select id="course" name="course" required>
                            <option value="">Select Course</option>
                            <optgroup label="Technical">
                                <option value="btech">B.Tech</option>
                                <option value="bca">BCA</option>
                                <option value="mca">MCA</option>
                            </optgroup>
                            <optgroup label="Non-Technical">
                                <option value="bcom">B.Com</option>
                                <option value="ba">BA</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="searchcourse">Search Specific Course / Subject:</label>
                    <input type="search" id="searchcourse" name="searchcourse" placeholder="Type course keyword...">
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Information</legend>
                
                <div class="form-group">
                    <label for="portfolio">Portfolio / Profile Website:</label>
                    <input type="url" id="portfolio" name="portfolio" placeholder="https://yourportfolio.com">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fee">Expected Course Fee Budget (₹):</label>
                        <input type="number" id="fee" name="fee" min="1000" max="500000" step="500" placeholder="e.g. 50000">
                    </div>

                    <div class="form-group">
                        <label for="themecolor">Favorite Portal Theme Color:</label>
                        <input type="color" id="themecolor" name="themecolor" value="#1d4ed8">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="joinmonth">Preferred Joining Month:</label>
                        <input type="month" id="joinmonth" name="joinmonth">
                    </div>

                    <div class="form-group">
                        <label for="joinweek">Preferred Joining Week:</label>
                        <input type="week" id="joinweek" name="joinweek">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="interviewtime">Preferred Interview Time:</label>
                        <input type="time" id="interviewtime" name="interviewtime">
                    </div>

                    <div class="form-group">
                        <label for="interviewslot">Preferred Interview Slot:</label>
                        <input type="datetime-local" id="interviewslot" name="interviewslot">
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>Account Details & Documents</legend>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Create Password:</label>
                        <input type="password" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmpassword">Confirm Password:</label>
                        <input type="password" id="confirmpassword" name="confirmpassword" minlength="8" placeholder="Re-enter password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="file">Upload Photo / ID Proof:</label>
                    <input type="file" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required>
                    <small class="form-note">Allowed formats: PDF, JPG, PNG (Max 2MB)</small>
                </div>
            </fieldset>

            <fieldset>
                <legend>Selection & Preferences</legend>
                
                <div class="choice-section">
                    <p class="choice-title">Gender:</p>
                    <div class="choice-options">
                        <label class="radio-label">
                            <input type="radio" id="male" name="gender" value="Male" required> Male
                        </label>
                        <label class="radio-label">
                            <input type="radio" id="female" name="gender" value="Female" required> Female
                        </label>
                        <label class="radio-label">
                            <input type="radio" id="other" name="gender" value="Other" required> Other
                        </label>
                    </div>
                </div>

                <div class="choice-section">
                    <p class="choice-title">Technical Skills:</p>
                    <div class="choice-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="skill1" name="skills" value="HTML"> HTML
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="skill2" name="skills" value="CSS"> CSS
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="skill3" name="skills" value="JavaScript"> JavaScript
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="skill4" name="skills" value="Python"> Python
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="skill5" name="skills" value="DSA"> DSA
                        </label>
                    </div>
                </div>

                <div class="confirm-box">
                    <label class="checkbox-label confirm-label">
                        <input type="checkbox" id="confirm" name="confirm" value="confirm" required>
                        I confirm that all the details entered above are true and accurate.
                    </label>
                </div>
            </fieldset>

            <div class="form-actions">
                <input type="reset" id="Reset" name="reset" value="Reset Form">
                <input type="submit" id="Submit" name="submit" value="Submit Registration">
            </div>
        </form>
    </div>
</body>
</html>
